spring:
  application:
    name: nearby
  aop:
    proxy-target-class: false

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    disable-swagger-default-url: true

kakao:
  native-app-key: ${KAKAO_NATIVE_APP_KEY:}
  oidc:
    issuer-uri: ${KAKAO_OIDC_ISSUER_URI:https://kauth.kakao.com}
    jwk-set-uri: ${KAKAO_OIDC_JWK_SET_URI:https://kauth.kakao.com/.well-known/jwks.json}

nearby:
  jwt:
    secret: ${NEARBY_JWT_SECRET}
    access-token-ttl-seconds: ${NEARBY_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl-seconds: ${NEARBY_REFRESH_TOKEN_TTL_SECONDS:1209600}
  phone-verification:
    hash-secret: ${NEARBY_PHONE_VERIFICATION_HASH_SECRET:${nearby.jwt.secret}}
  sms:
    solapi:
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      from-number: ${SOLAPI_FROM_NUMBER:}
  place:
    default-image-url: ${NEARBY_PLACE_DEFAULT_IMAGE_URL:https://nearby.sopt.org/images/default-place.png}
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      timeout-ms: ${GOOGLE_PLACES_TIMEOUT_MS:1000}
      photo:
        max-width-px: ${GOOGLE_PLACES_PHOTO_MAX_WIDTH_PX:640}

management:
  tracing:
    enabled: false

plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':adapter-in:web')
    implementation project(':adapter-out:persistence')
    implementation project(':adapter-out:security')
    implementation project(':adapter-out:storage')
    implementation project(':adapter-out:notification')
    implementation project(':adapter-out:google-maps')
    implementation project(':application')
    implementation project(':common')
    implementation project(':logging')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.48.0'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
    runtimeOnly 'org.springframework.modulith:spring-modulith-observability'
    runtimeOnly 'io.sentry:sentry-logback:8.48.0'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

# main 브랜치에서 운영 EC2 연결과 배포 권한만 점검합니다.
name: Check production access

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nearby-operations-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Production access check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: ${{ vars.PROD_AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.PROD_AWS_ACCOUNT_ID }}
      EC2_INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
      APP_SERVICE_NAME: ${{ vars.PROD_APP_SERVICE_NAME }}
      APP_DIR: ${{ vars.PROD_APP_DIR }}
      APP_JAR_PATH: ${{ vars.PROD_APP_JAR_PATH }}
      APP_PORT: ${{ vars.PROD_APP_PORT }}
      SERVICE_URL: ${{ vars.PROD_SERVICE_URL }}
      DEPLOY_S3_BUCKET: ${{ vars.PROD_DEPLOY_S3_BUCKET }}
      HEALTHCHECK_PATH: ${{ vars.PROD_HEALTHCHECK_PATH }}
      SSM_ENV_PATH: ${{ vars.PROD_SSM_ENV_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate deploy settings
        shell: bash
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.PROD_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production deployment is allowed only from main" >&2
            exit 1
          fi

          for name in AWS_REGION AWS_ACCOUNT_ID EC2_INSTANCE_ID APP_SERVICE_NAME APP_DIR APP_JAR_PATH APP_PORT SERVICE_URL DEPLOY_S3_BUCKET HEALTHCHECK_PATH SSM_ENV_PATH AWS_ROLE_TO_ASSUME; do
            if [ -z "${!name}" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}
          role-session-name: nearby-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS and production EC2 access
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          test "$account" = "$AWS_ACCOUNT_ID"
          target="$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" --query "Reservations[0].Instances[0].Tags[?Key=='Environment'].Value | [0]" --output text)"
          test "$target" = production
          aws s3api head-bucket --bucket "$DEPLOY_S3_BUCKET"
          parameters="$(jq -n --arg path "$SSM_ENV_PATH" --arg region "$AWS_REGION" '{commands: [
            "set -eu",
            "cloud-init status",
            "java -version 2>&1",
            "test -d /opt/nearby",
            "systemctl cat nearby.service >/dev/null",
            "systemctl is-active caddy amazon-cloudwatch-agent",
            "count=$(aws ssm get-parameters-by-path --path \($path) --region \($region) --recursive --with-decryption --query \"length(Parameters)\" --output json); test \"$count\" -gt 0; echo Runtime_parameters_read=$count"
          ]}')"
          command_id="$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "Verify production deployment access" \
            --parameters "$parameters" --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" || {
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query '{commandId:CommandId,status:Status,statusDetails:StatusDetails,responseCode:ResponseCode,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
            exit 1
          }
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent}' --output json

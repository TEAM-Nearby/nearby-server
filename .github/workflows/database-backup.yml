name: Database backup
on:
  schedule:
    - cron: '0 20 * * *' # KST 05:00.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nearby-backup-prod
  cancel-in-progress: false
jobs:
  skipped:
    if: vars.BACKUP_ENABLED != 'true' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain skipped backup
        env:
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          EXECUTION_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo '### Backup skipped'
            if [ "$BACKUP_ENABLED" != true ]; then
              echo 'BACKUP_ENABLED is missing or is not true. Scheduled backups are disabled.'
            else
              printf 'Run on the default branch %s instead of %s.\n' "$DEFAULT_BRANCH" "$EXECUTION_REF"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  backup:
    permissions:
      contents: read
      id-token: write
    if: vars.BACKUP_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: prod-backup
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.58.5
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PROD_DB_BACKUP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Dump, encrypt and verify S3 backups
        env:
          BACKUP_S3_BUCKET: ${{ vars.PROD_BACKUP_S3_BUCKET }}
          SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: python3 scripts/backup/backup.py
      - name: Record backup status
        if: always()
        env:
          BACKUP_STATUS: ${{ job.status }}
        run: |
          printf '\nBackup result: %s\n' "$BACKUP_STATUS" >> "$GITHUB_STEP_SUMMARY"
